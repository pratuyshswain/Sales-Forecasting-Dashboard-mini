name: Docker smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t local-project .
      - run: docker run --rm --entrypoint python local-project -c 'import os; assert os.getuid() != 0'
      - name: Runtime smoke test
        run: |
          docker run --name smoke --entrypoint sh local-project -ec 'rm -f /app/output/forecast_risk_dashboard.png /app/sales.db; exec python run_pipeline.py'
          docker cp smoke:/app/output/forecast_risk_dashboard.png /tmp/dashboard.png
          docker cp smoke:/app/sales.db /tmp/sales.db
          test -s /tmp/dashboard.png
          python -c 'import sqlite3; c=sqlite3.connect("/tmp/sales.db"); assert c.execute("select count(*) from sales_predictions").fetchone()[0] > 0'
